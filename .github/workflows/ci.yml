name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Unit tests
        working-directory: backend
        run: npm test

      # Case-sensitive filesystems are where import-casing bugs surface. macOS
      # is case-insensitive, so a wrong-case import runs locally and fails only
      # once deployed — this repo shipped exactly that twice.
      - name: Verify every relative import resolves
        working-directory: backend
        run: node scripts/checkImports.js

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings 40

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false # warnings are not build failures here; lint gates them above
