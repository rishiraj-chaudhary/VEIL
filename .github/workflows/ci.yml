name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Unit tests
        working-directory: backend
        run: npm test

      # Case-sensitive filesystems are where import-casing bugs surface. macOS
      # is case-insensitive, so a wrong-case import runs locally and fails only
      # once deployed — this repo shipped exactly that twice.
      - name: Verify every relative import resolves
        working-directory: backend
        run: node scripts/checkImports.js

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The allowance was 40 warnings, which is enough room for the build to be
      # failing on lint locally while CI stays green. The tree is clean, so the
      # gate is zero.
      - name: Lint
        working-directory: frontend
        run: npx eslint src --max-warnings 0

      - name: Tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI was set to false here specifically so that warnings would not fail the
      # build — which meant `npm run build` passed in CI while failing for anyone
      # running it with CI set, the default on every CI provider.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: true
